<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Промавтоматика · Вхід</title>
<link rel="stylesheet" href="css/app.css">
</head><body>
<div class="login">
  <div class="logo" style="margin-bottom:14px">Група компаній «<span>ПРОМАВТОМАТИКА</span>»</div>
  <h1>Калькулятор індикативних КП</h1>
  <div class="sub">Вхід для менеджерів напрямку ВДЕ</div>
  <form id="f">
    <div class="f"><label class="f">Пошта</label><input id="email" type="text" autocomplete="username" required></div>
    <div class="f"><label class="f">Пароль</label><input id="pass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="err"></div>
    <button class="btn" id="btn" type="submit">Увійти</button>
  </form>
  <div class="hint" style="margin-top:16px">Немає доступу? Акаунти створює адміністратор.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(async () => {
  if (!configured()) { document.getElementById("err").textContent = "Сайт не налаштовано: заповніть js/config.js."; return; }
  const a = await getSessionProfile();
  if (a) { location.replace("calculator.html"); return; }
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("btn"), err = document.getElementById("err");
    btn.disabled = true; err.textContent = "";
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("pass").value });
    if (error) { err.textContent = /invalid/i.test(error.message) ? "Невірна пошта або пароль." : error.message; btn.disabled = false; return; }
    location.replace("calculator.html");
  });
})();
</script>
</body></html>
