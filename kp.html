<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Індикативна пропозиція</title>
<link rel="stylesheet" href="css/app.css?v=202608250129">
<style>
/* Сторінка перегляду КП: показуємо тільки згенеровані аркуші + панель дій */
html,body{margin:0;background:#5f5b58}
#offer{display:block;padding:22px 0 40px}
#wrap{overflow:hidden}
#offer{transform-origin:top left}
#offer .pg{box-shadow:0 4px 18px rgba(0,0,0,.35)}
.bar{position:sticky;top:0;z-index:10;background:var(--g);color:var(--w);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px}
.bar .btn{padding:9px 18px}
.bar .ghost{background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--w)}
.bar .hint{color:rgba(255,255,255,.75);font-size:12px;margin:0;line-height:1.35}
.bar .num{font-weight:bold;font-size:14px}
.empty{max-width:520px;margin:80px auto;background:var(--w);border-radius:10px;padding:26px;font-size:14px}
@media print{
  html,body{background:#fff}
  .bar{display:none!important}
  #offer{padding:0;transform:none!important;width:auto!important;margin:0!important}
  #wrap{height:auto!important;overflow:visible}
  #offer .pg{box-shadow:none}
}
</style></head><body>
<div class="bar">
  <span class="num" id="kpNum">КП</span>
  <button class="btn" id="shareBtn">Поділитись PDF</button>
  <button class="btn ghost" onclick="window.print()">Друк</button>
  <button class="btn ghost" onclick="window.close()">Закрити</button>
  <p class="hint" id="barHint">«Поділитись PDF» збирає файл прямо на пристрої: на телефоні відкриється меню «Поділитись» (Telegram, пошта, Viber…), на комп'ютері файл завантажиться.</p>
</div>
<div id="wrap"><div id="offer"></div></div>
<script src="js/vendor/html2canvas.min.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script>
(() => {
  let html = null, num = "", client = "";
  try { html = localStorage.getItem("kp_html"); num = localStorage.getItem("kp_num") || ""; client = localStorage.getItem("kp_client") || ""; } catch (e) {}
  if (!html) {
    document.getElementById("offer").innerHTML = '<div class="empty">Немає сформованого КП. Поверніться в калькулятор і натисніть «Сформувати КП».</div>';
    return;
  }
  document.getElementById("offer").innerHTML = html;
  document.getElementById("kpNum").textContent = "КП № " + num + (client ? " · " + client : "");
  document.title = "КП " + num + (client ? " · " + client : "");
  /* На вузьких екранах (телефон) масштабуємо аркуші А4 під ширину екрана, не змінюючи верстку */
  const off = document.getElementById("offer"), wrap = document.getElementById("wrap");
  const fit = () => { const pageW = 210 * 96 / 25.4; const k = Math.min(1, (window.innerWidth - 12) / pageW);
    if (k < 1) { off.style.width = pageW + "px"; off.style.transform = "scale(" + k + ")"; off.style.marginLeft = Math.max(0, (window.innerWidth - pageW * k) / 2) + "px"; wrap.style.height = (off.offsetHeight * k) + "px"; }
    else { off.style.width = ""; off.style.transform = ""; off.style.marginLeft = ""; wrap.style.height = ""; } };
  fit(); window.addEventListener("resize", fit); window.addEventListener("load", fit);
  window.addEventListener("beforeprint", () => { off.style.transform = ""; off.style.width = ""; off.style.marginLeft = ""; wrap.style.height = ""; }); window.addEventListener("afterprint", fit);

  /* ---- «Поділитись PDF»: рендеримо кожен аркуш у canvas і збираємо PDF на пристрої ---- */
  const btn = document.getElementById("shareBtn");
  const safe = s => (s || "").replace(/[«»"'\\/:*?<>|]/g, "").trim().replace(/\s+/g, "_").slice(0, 40);
  btn.onclick = async () => {
    const old = btn.textContent;
    btn.disabled = true;
    try {
      /* тимчасово знімаємо масштаб, щоб рендер ішов у повній роздільності */
      const st = [off.style.transform, off.style.width, off.style.marginLeft, wrap.style.height];
      off.style.transform = ""; off.style.width = ""; off.style.marginLeft = ""; wrap.style.height = "";
      const pages = [...document.querySelectorAll("#offer .pg")];
      const pdf = new jspdf.jsPDF({ unit: "mm", format: "a4", compress: true });
      for (let i = 0; i < pages.length; i++) {
        btn.textContent = "Сторінка " + (i + 1) + " з " + pages.length + "…";
        const cv = await html2canvas(pages[i], { scale: 1.6, useCORS: true, backgroundColor: "#ffffff", logging: false });
        if (i > 0) pdf.addPage();
        pdf.addImage(cv.toDataURL("image/jpeg", 0.87), "JPEG", 0, 0, 210, 297, undefined, "FAST");
      }
      [off.style.transform, off.style.width, off.style.marginLeft, wrap.style.height] = st;
      const fname = "КП_" + safe(num) + (client ? "_" + safe(client) : "") + ".pdf";
      const blob = pdf.output("blob");
      const file = new File([blob], fname, { type: "application/pdf" });
      /* меню «Поділитись» — тільки на телефонах/планшетах; на ПК одразу завантаження */
      const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
      let shared = false;
      if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: fname }); shared = true; }
        catch (e) { if (e.name === "AbortError") shared = true; }   // користувач сам закрив меню
      }
      if (!shared) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = fname; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 30000);
      }
    } catch (e) {
      alert("Не вдалося зібрати PDF: " + e.message + ". Скористайтесь кнопкою «Друк» → «Зберегти як PDF».");
    }
    btn.textContent = old; btn.disabled = false;
  };
})();
</script>
</body></html>
